services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run prisma:generate --workspace backend && npm run prisma:deploy --workspace backend && npm run data:encrypt-existing --workspace backend && npm run prisma:seed --workspace backend && npm run dev --workspace backend"
    ports: ["3000:3000"]
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:5173
      MEDIA_STORAGE_DIR: /app/backend/var/media
    volumes:
      - .:/app
      - yaa-node-modules:/app/node_modules
      - yaa-backend-modules:/app/backend/node_modules
      - yaa-media:/app/backend/var/media
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev --workspace frontend -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - .:/app
      - yaa-node-modules:/app/node_modules
      - yaa-frontend-modules:/app/frontend/node_modules
    depends_on: [api]
volumes:
  yaa-node-modules:
  yaa-backend-modules:
  yaa-media:
  yaa-frontend-modules:
